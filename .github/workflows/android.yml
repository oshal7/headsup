name: Android app

# Builds the Bujho Toh! Android app on GitHub's servers: no Android Studio needed.
#
#  - Every push to main (that touches the app) and every manual run:
#      * "BujhoToh-debug-apk"  - install this on your phone to test (also published at
#        https://github.com/oshal7/headsup/releases/download/latest-build/BujhoToh.apk)
#      * "BujhoToh-release"    - signed .aab for Google Play (+ signed .apk),
#                                only when the signing secrets are set (see PLAY_STORE.md)
#  - Pushing a tag like v1.0.0 also creates a GitHub Release with the files attached.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'js/data.js'
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'js/data.js'
      - 'content/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach files to a GitHub Release on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # versionCode must go up with every Play upload; the run number always does.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Check the app's cards match content/ and js/data.js
        working-directory: .
        run: |
          node tools/build-content.js
          git diff --exit-code android/app/src/main/assets/content.json || {
            echo "::error::content.json is out of date. Run: node tools/build-content.js"; exit 1; }

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PversionCode=$VERSION_CODE -PversionName=${VERSION_NAME#v}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BujhoToh-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish the direct download link
        # https://github.com/<owner>/<repo>/releases/download/latest-build/BujhoToh.apk
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BujhoToh.apk
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build BujhoToh.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest test build ($VERSION_NAME)" \
            --notes "Test build of Bujho Toh! for Android, built automatically from the latest code.

          **Install:** open this page on your Android phone, tap **BujhoToh.apk**, then allow installing from your browser when asked.
          New builds install over the old one and keep your scores.

          Commit: $GITHUB_SHA"
          rm BujhoToh.apk

      - name: Set up release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release (AAB for Play + APK)
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew :app:bundleRelease :app:assembleRelease -PversionCode=$VERSION_CODE -PversionName=${VERSION_NAME#v}

      - name: Upload release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BujhoToh-release-${{ env.VERSION_NAME }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: No signing key yet
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::Signing secrets are not set, so only the debug APK was built. See PLAY_STORE.md to add them."

      - name: Remove signing files
        if: always()
        run: rm -f upload.jks keystore.properties

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - name: Run tests
        timeout-minutes: 15
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
